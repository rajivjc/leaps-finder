name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Scanner (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

  web:
    name: Web (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsconfig pulls in .next/types (LayoutProps and friends), which do not
      # exist on a fresh checkout — generate them before typechecking.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      # The spec formulas that live in TypeScript rather than in the scanner:
      # §5.5's cushion, §7's position sizing, and the null display semantics.
      - name: Test
        run: npm test

      # Builds without Supabase env vars on purpose: the app must degrade to an
      # unconfigured state rather than fail the build.
      - name: Build
        run: npm run build
